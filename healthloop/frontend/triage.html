<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not Feeling Well? - HealthLoop</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #hospital-map { height: 220px; border-radius: 14px; margin-bottom: 14px; z-index: 1; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="side-nav">
    <div class="brand">H</div>
    <a href="index.html"><span>Home</span></a>
    <a href="upload.html"><span>Reports</span></a>
    <a href="reminders.html"><span>Meds</span></a>
    <a href="triage.html" class="active"><span>Care</span></a>
    <a href="mental-health.html"><span>Talk</span></a>
    <a href="my-data.html"><span>My Data</span></a>
    <a href="#" onclick="logout(); return false;"><span>Log Out</span></a>
  </nav>

  <div class="content-area">
  <header class="topbar"><h1>Not Feeling Well?</h1></header>

  <main>
    <div class="card">
      <p>Answer a few quick questions and we'll suggest which kind of doctor to see.</p>
    </div>

    <div class="chat-window" id="chat-window"></div>

    <div id="input-area" class="card" style="display:none;">
      <input id="answer-input" placeholder="Type your answer..." onkeypress="if(event.key==='Enter') sendAnswer()" />
      <button onclick="sendAnswer()">Send</button>
    </div>

    <div id="result-area" class="card" style="display:none;">
      <h3>Suggested Specialty</h3>
      <p id="specialty-text" style="font-weight:600; color:var(--primary); font-size:16px;"></p>
      <p id="reasoning-text"></p>
      <button class="listen" onclick="toggleSpeak(this, document.getElementById('reasoning-text').textContent, getUserLanguage())">Listen</button>
      <button onclick="findNearbyHospitals()" style="margin-top:10px;">Find Nearby Hospitals</button>
    </div>

    <div id="hospitals-loading" class="card" style="display:none;">
      <p class="loading">Finding hospitals near you...</p>
    </div>

    <div id="hospital-map" style="display:none;"></div>
    <div id="hospitals-area" style="display:none;"></div>
  </main>
  </div>

</div>

<script src="app.js"></script>
<script>
let history = [];
let isEmergency = false;
let recommendedSpecialty = "";
let leafletMap = null;
let mapMarkers = [];

function addBubble(role, text) {
  const win = document.getElementById("chat-window");
  const bubble = document.createElement("div");
  bubble.className = `chat-bubble ${role}`;
  bubble.textContent = text;
  win.appendChild(bubble);
  win.scrollTop = win.scrollHeight;
}

async function startTriage() {
  addBubble("assistant", "Hi, tell me what's bothering you today — a symptom, pain, or injury.");
  document.getElementById("input-area").style.display = "block";
}

async function sendAnswer() {
  const input = document.getElementById("answer-input");
  const text = input.value.trim();
  if (!text) return;
  addBubble("user", text);
  history.push({ role: "user", content: text });
  input.value = "";
  input.disabled = true;

  try {
    const result = await apiPost("/triage/next", {
      conversation_history: history,
      language: getUserLanguage(),
    });

    if (result.done) {
      document.getElementById("input-area").style.display = "none";
      document.getElementById("result-area").style.display = "block";
      document.getElementById("specialty-text").textContent = result.recommended_specialty;
      document.getElementById("reasoning-text").textContent = result.reasoning;
      recommendedSpecialty = result.recommended_specialty || "";
      isEmergency = recommendedSpecialty.toLowerCase().includes("emergency");
      if (isEmergency) {
        addBubble("assistant", "This sounds urgent. Please consider calling emergency services right away.");
      }
    } else {
      addBubble("assistant", result.next_question);
      history.push({ role: "assistant", content: result.next_question });
    }
  } catch (e) {
    addBubble("assistant", "Sorry, something went wrong: " + e.message);
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function findNearbyHospitals() {
  if (!("geolocation" in navigator)) {
    alert("Location isn't available in this browser. Try on a mobile device.");
    return;
  }
  document.getElementById("hospitals-loading").style.display = "block";
  document.getElementById("hospitals-area").style.display = "none";

  navigator.geolocation.getCurrentPosition(async (position) => {
    try {
      const result = await apiPost("/hospitals/nearby", {
        lat: position.coords.latitude,
        lon: position.coords.longitude,
        is_emergency: isEmergency,
        radius_m: 5000,
        specialty: recommendedSpecialty,
      });
      renderHospitals(result);
    } catch (e) {
      alert("Could not find hospitals: " + e.message);
    } finally {
      document.getElementById("hospitals-loading").style.display = "none";
    }
  }, () => {
    document.getElementById("hospitals-loading").style.display = "none";
    alert("Location permission is needed to find nearby hospitals.");
  });
}

function renderHospitals(result) {
  const container = document.getElementById("hospitals-area");
  container.style.display = "block";
  container.innerHTML = "";

  const modeLabel = result.mode === "emergency"
    ? '<span class="badge orange">Showing only 24/7 emergency-capable hospitals</span>'
    : '<span class="badge green">Showing hospitals open right now</span>';
  const modeCard = document.createElement("div");
  modeCard.className = "card";
  modeCard.innerHTML = `<p>${modeLabel}</p>`;
  container.appendChild(modeCard);

  if (!result.hospitals.length) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.innerHTML = "<p>No matching hospitals found nearby. Try a wider search radius, or call emergency services directly if this is urgent.</p>";
    container.appendChild(empty);
    document.getElementById("hospital-map").style.display = "none";
    return;
  }

  renderMap(result.hospitals, result.mode);

  result.hospitals.forEach((h, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = `hospital-card-${i}`;
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lon}`;
    const specialtyBadge = h.specialty_match
      ? `<span class="badge blue">Confirmed specialty match</span>`
      : "";
    card.innerHTML = `
      <h3>${h.name} <span class="badge ${result.mode === 'emergency' ? 'orange' : 'green'}">${h.status}</span></h3>
      ${specialtyBadge}
      <p>${h.phone ? h.phone : "Phone number not listed"}</p>
      <a class="btn" style="display:inline-block; text-decoration:none;" href="${mapsUrl}" target="_blank">Get Directions</a>
    `;
    card.style.cursor = "pointer";
    card.onclick = (e) => {
      // don't hijack the "Get Directions" link click
      if (e.target.tagName === "A") return;
      focusHospitalOnMap(i);
    };
    container.appendChild(card);
  });
}

function renderMap(hospitals, mode) {
  const mapDiv = document.getElementById("hospital-map");
  mapDiv.style.display = "block";

  const valid = hospitals.filter(h => h.lat && h.lon);
  if (!valid.length) {
    mapDiv.style.display = "none";
    return;
  }

  if (leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }
  mapMarkers = [];

  leafletMap = L.map("hospital-map").setView([valid[0].lat, valid[0].lon], 13);

  // OpenStreetMap tiles - free, no API key required
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(leafletMap);

  const markerColor = mode === "emergency" ? "#dc2626" : "#16a34a";

  valid.forEach((h, i) => {
    const icon = L.divIcon({
      className: "",
      html: `<div style="background:${markerColor}; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [14, 14],
    });
    const marker = L.marker([h.lat, h.lon], { icon }).addTo(leafletMap);
    marker.bindPopup(`<b>${h.name}</b><br>${h.status}`);
    marker.on("click", () => {
      document.getElementById(`hospital-card-${i}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    mapMarkers.push(marker);
  });

  // Fit map bounds to show all pins
  const group = L.featureGroup(mapMarkers);
  leafletMap.fitBounds(group.getBounds().pad(0.2));
}

function focusHospitalOnMap(index) {
  if (!leafletMap || !mapMarkers[index]) return;
  document.getElementById("hospital-map").scrollIntoView({ behavior: "smooth", block: "center" });
  leafletMap.setView(mapMarkers[index].getLatLng(), 15);
  mapMarkers[index].openPopup();
}

startTriage();
</script>
</body>
</html>
