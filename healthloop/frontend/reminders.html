<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reminders - HealthLoop</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="side-nav">
    <div class="brand">🩺</div>
    <a href="index.html"><span class="icon">🏠</span><span>Home</span></a>
    <a href="upload.html"><span class="icon">📷</span><span>Reports</span></a>
    <a href="reminders.html" class="active"><span class="icon">💊</span><span>Meds</span></a>
    <a href="triage.html"><span class="icon">🩹</span><span>Care</span></a>
    <a href="mental-health.html"><span class="icon">💬</span><span>Talk</span></a>
    <a href="my-data.html"><span class="icon">🔒</span><span>My Data</span></a>
    <a href="#" onclick="logout(); return false;"><span class="icon">🚪</span><span>Log Out</span></a>
  </nav>

  <div class="content-area">
  <header class="topbar"><h1>💊 Medicine Reminders</h1></header>

  <main>
    <div class="card">
      <h3>Add a reminder</h3>
      <p style="font-size:13px; color:var(--muted);">Know the medicine details? Fill them in below. Don't know them, or just want a quick reminder? Skip straight to setting a time — that's all that's required.</p>
      <input id="med-name" placeholder="Medicine name (optional)" />
      <input id="med-dosage" placeholder="Dosage, e.g. 500mg (optional)" />
      <input id="med-frequency" placeholder="Frequency, e.g. twice daily (optional)" />
      <label style="font-size:13px; color:var(--text); display:block; margin-bottom:4px;">Time to remind you</label>
      <input id="med-time" type="time" required />
      <button onclick="addReminder()">Add Reminder</button>
    </div>

    <div id="reminders-list"></div>
  </main>
  </div>

</div>

<script src="app.js"></script>
<script>
async function loadReminders() {
  const userId = getUserId();
  const reminders = await apiGet(`/reminders${userId ? "?user_id=" + userId : ""}`);
  const container = document.getElementById("reminders-list");
  container.innerHTML = "";

  if (!reminders.length) {
    container.innerHTML = `<div class="card"><p>No reminders yet.</p></div>`;
    return;
  }

  reminders.forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    const title = r.medicine_name || "Reminder";
    const speakText = `Time to take ${title}${r.dosage ? ", " + r.dosage : ""}${r.frequency ? ", " + r.frequency : ""}`;
    const details = [r.dosage, r.frequency].filter(Boolean).join(" — ");
    card.innerHTML = `
      <h3>${title} ${r.taken ? '<span class="badge green">Taken</span>' : '<span class="badge orange">Pending</span>'}</h3>
      ${details ? `<p>${details}</p>` : ""}
      ${r.reminder_time ? `<p>⏰ ${r.reminder_time}</p>` : ""}
      <button class="listen" onclick='speak(${JSON.stringify(speakText)}, getUserLanguage())'>🔊 Listen</button>
      ${!r.taken ? `<button onclick="markTaken(${r.id})">Mark as Taken</button>` : ""}
    `;
    container.appendChild(card);
  });
}

async function markTaken(id) {
  await apiPost(`/reminders/${id}/taken`, {});
  loadReminders();
}

async function addReminder() {
  const medicine_name = document.getElementById("med-name").value.trim();
  const dosage = document.getElementById("med-dosage").value.trim();
  const frequency = document.getElementById("med-frequency").value.trim();
  const reminder_time = document.getElementById("med-time").value;

  if (!reminder_time) return alert("Please set a time for the reminder.");

  await apiPost("/reminders", {
    user_id: getUserId() ? parseInt(getUserId()) : null,
    medicine_name, dosage, frequency, reminder_time,
  });
  document.getElementById("med-name").value = "";
  document.getElementById("med-dosage").value = "";
  document.getElementById("med-frequency").value = "";
  document.getElementById("med-time").value = "";
  loadReminders();
}

loadReminders();
</script>
</body>
</html>
